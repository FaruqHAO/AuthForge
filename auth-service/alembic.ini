# =============================================================================
# Alembic Configuration
# =============================================================================
# Database migrations for the auth service.
# Uses async SQLAlchemy with autogenerate support.
# =============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .

# Database URL is overridden in env.py from application settings.
# This fallback is for alembic CLI convenience only.
sqlalchemy.url = postgresql+asyncpg://auth_user:auth_password@localhost:5432/auth_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
